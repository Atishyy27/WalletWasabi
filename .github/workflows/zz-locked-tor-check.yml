name: locked-tor-check
on:
  push:
    branches: [ci-14362]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: first build passes
        run: dotnet build WalletWasabi.Fluent.Desktop -c Debug
      - name: start the bundled tor from the output directory
        shell: pwsh
        run: |
          $tor = Get-ChildItem WalletWasabi.Fluent.Desktop/bin -Recurse -Filter tor.exe | Select-Object -First 1
          if (-not $tor) { throw "tor.exe not found in the output" }
          Start-Process -FilePath $tor.FullName -ArgumentList '--SocksPort','0' -WindowStyle Hidden
          Start-Sleep 5
          Get-Process tor | Format-Table Id, Path
      - name: rebuild must fail with the new error
        shell: pwsh
        run: |
          dotnet build WalletWasabi.Fluent.Desktop -c Debug --no-incremental 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -eq 0) { throw "build passed while tor was running" }
          if (-not (Select-String -Path build.log -Pattern "is still running and would be locked")) { throw "failed, but not with our error" }
          "failed as expected with our error"
          exit 0
      - name: stop tor, rebuild passes
        shell: pwsh
        run: |
          Get-Process tor | Stop-Process -Force
          dotnet build WalletWasabi.Fluent.Desktop -c Debug
